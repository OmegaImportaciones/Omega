<body data-base="../" data-page="shop">

    <main id="main" class="shop">

        <div class="shop-head">
            <div>
                <p class="eyebrow">Omega Importaciones</p>
                <h1>Catálogo completo</h1>
            </div>
            <p class="result-summary" id="resultSummary" aria-live="polite">Cargando productos…</p>
        </div>
        <a class="sas-strip" href="../pages/sas.html"><span data-icon="sas"></span><span><strong>¿Buscas SAS?</strong> Nuestra marca propia, con 2 años de garantía.</span><span class="sas-strip-go">Ver SAS</span></a>

        <div class="shop-toolbar">
            <div class="chips" id="categoryChips" role="group" aria-label="Filtrar"></div>
            <label class="sort">
                <span>Ordenar</span>
                <select id="sortSelect">
                    <option value="relevancia">Destacados</option>
                    <option value="precio-asc">Menor precio</option>
                    <option value="precio-desc">Mayor precio</option>
                    <option value="nombre">Nombre A–Z</option>
                </select>
            </label>
        </div>

        <div class="product-grid" id="shopGrid"></div>

        <div class="shop-sentinel" id="shopSentinel" aria-hidden="true"></div>

    </main>
