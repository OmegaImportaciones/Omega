<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <!-- Tema inicial (evita parpadeo) -->
    <script>
        (function () {
            try {
                if (localStorage.getItem('omega-theme') === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) { }
        })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Tienda | Omega Importaciones</title>

    <meta name="description" content="Todos los productos disponibles de Omega Importaciones con precio. Arma tu pedido y envíalo por WhatsApp.">
    <meta name="theme-color" content="#e8ebee">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://omegaimportaciones.github.io/Omega/pages/catalogo.html">

    <!-- Open Graph -->
    <meta property="og:title" content="Tienda | Omega Importaciones">
    <meta property="og:description" content="Todos los productos disponibles de Omega Importaciones con precio. Arma tu pedido y envíalo por WhatsApp.">
    <meta property="og:image" content="https://omegaimportaciones.github.io/Omega/img/logo.png">
    <meta property="og:url" content="https://omegaimportaciones.github.io/Omega/pages/catalogo.html">
    <meta property="og:site_name" content="Omega Importaciones">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_BO">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="../img/favicon.png" type="image/png">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PNVK91HBNP"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-PNVK91HBNP');
    </script>

    <!-- Tipografías: Unbounded (títulos y precios) + Manrope (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/main.css?v=4">

</head>

<body data-base="../" data-page="shop">

    <main id="main" class="shop">

        <div class="shop-head">
            <h1>Tienda</h1>
            <p class="result-summary" id="resultSummary" aria-live="polite">Cargando productos…</p>
        </div>

        <div class="shop-toolbar">
            <div class="chips" id="categoryChips" role="group" aria-label="Categorías"></div>
            <label class="sort">
                <span>Ordenar</span>
                <select id="sortSelect">
                    <option value="relevancia">Destacados</option>
                    <option value="precio-asc">Menor precio</option>
                    <option value="precio-desc">Mayor precio</option>
                    <option value="nombre">Nombre A–Z</option>
                </select>
            </label>
        </div>

        <div class="product-grid" id="shopGrid"></div>

        <div class="shop-sentinel" id="shopSentinel" aria-hidden="true"></div>

    </main>

    <!-- Configuración -->
    <script src="../js/config/store.config.js"></script>
    <script src="../js/config/pricing.config.js"></script>

    <!-- Núcleo -->
    <script src="../js/core/utils.js"></script>
    <script src="../js/core/analytics.js"></script>
    <script src="../js/core/pricing.js"></script>
    <script src="../js/core/inventory.js"></script>
    <script src="../js/core/categories.js"></script>
    <script src="../js/core/catalog.js"></script>
    <script src="../js/core/search.js"></script>
    <script src="../js/core/cart.js"></script>
    <script src="../js/core/whatsapp.js"></script>

    <!-- Interfaz -->
    <script src="../js/ui/icons.js"></script>
    <script src="../js/ui/theme.js"></script>
    <script src="../js/ui/toast.js"></script>
    <script src="../js/ui/productCard.js"></script>
    <script src="../js/ui/cartDrawer.js"></script>
    <script src="../js/ui/shell.js"></script>
    <script src="../js/pages/shop.js"></script>

</body>

</html>
